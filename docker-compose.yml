services:
  lorekeeper-bot:
    image: ghcr.io/${GITHUB_ACTOR:-mjyousif}/lorekeeper:latest
    container_name: lorekeeper-bot
    command: ["uv", "run", "python", "-m", "src.interfaces.telegram_bot"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_SESSION_DB=/.db/sessions.db
    volumes:
      - lorekeeper-db:/.db
      - ./data:/app/data

  lorekeeper-api:
    image: ghcr.io/${GITHUB_ACTOR:-mjyousif}/lorekeeper:latest
    container_name: lorekeeper-api
    command: ["uv", "run", "uvicorn", "src.interfaces.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - lorekeeper-db:/.db
      - ./data:/app/data

  lorekeeper-ui:
    image: ghcr.io/${GITHUB_ACTOR:-mjyousif}/lorekeeper:latest
    container_name: lorekeeper-ui
    command: ["uv", "run", "python", "-m", "src.interfaces.gradio_app"]
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - lorekeeper-api
    volumes:
      - lorekeeper-db:/.db
      - ./data:/app/data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    profiles:
      - local-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Optional: Enable GPU acceleration or limit CPU/Memory usage
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'        # Limit Ollama to 4 CPU cores (adjust based on your CPU)
    #       memory: 4096M    # Limit RAM usage
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: ollama-pull-model
    profiles:
      - local-llm
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=ollama
    entrypoint: /bin/sh
    command: -c "ollama pull $${LLM_MODEL#ollama/}"
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  lorekeeper-db:
  ollama-data:
