[project]
name = "lorekeeper"
version = "0.1.0"
description = "RAG system with vector storage abstraction"
requires-python = ">=3.11"


dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "chromadb",
    "sentence-transformers",
    "pypdf",
    "litellm",
    "python-dotenv",
    "pyyaml",
    "toml",
    "pydantic-settings",
    "python-telegram-bot>=22.6",
    "telegramify-markdown>=1.1.0",
]

[project.scripts]
lorekeeper = "src.cli:main"

[dependency-groups]
ui = ["gradio>=4.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "black",
    "ruff",
    "reportlab>=4.5.1",
    "mypy>=2.3.1",
    "bandit>=1.9.4",
    "pre-commit>=4.6.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: marks tests as integration tests (deselect with '-m not integration')"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
